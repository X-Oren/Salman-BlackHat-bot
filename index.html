<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hat MEA - SALMAN OSINT Ultimate Command Center</title>
    <style>
        :root {
            --bg-main: #010306;
            --card-bg: rgba(7, 11, 18, 0.95);
            --border-color: #121d2d;
            --cyan-glow: #00f0ff;
            --red-glow: #ff0055;
            --gold-color: #ffd700;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.05), transparent 70%),
                linear-gradient(180deg, rgba(1, 3, 6, 0.98) 0%, rgba(3, 6, 12, 0.99) 100%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .header-bar {
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-hat {
            width: 28px;
            height: 28px;
            background: var(--cyan-glow);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .logo-sub {
            font-size: 0.55rem;
            color: var(--cyan-glow);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-tag {
            background: var(--cyan-glow);
            color: #000;
            padding: 5px 14px;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 3px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 15px;
        }

        .hero-champion {
            background: rgba(7, 11, 18, 0.9);
            border: 1px solid var(--border-color);
            border-right: 3px solid var(--gold-color);
            border-radius: 6px;
            padding: 18px 15px;
            text-align: center;
            margin: 15px 0 25px 0;
        }

        .champ-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            direction: ltr;
            margin-bottom: 6px;
        }

        .champ-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            direction: ltr;
            letter-spacing: 1px;
            margin: 4px 0;
        }

        .champ-badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--cyan-glow);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            direction: ltr;
            margin-top: 6px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--cyan-glow);
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .tool-sidebar-banner {
            width: 6px;
            border-radius: 3px;
            background: var(--cyan-glow);
            flex-shrink: 0;
        }

        .banner-red { background: var(--red-glow); }
        .banner-gold { background: var(--gold-color); }

        .tool-content { flex: 1; }

        .tool-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tool-name-code {
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
        }

        .tool-short-tag {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan-glow);
            border: 1px solid var(--cyan-glow);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }

        .tool-info-text {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }
